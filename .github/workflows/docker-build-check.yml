name: Docker Build Check

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
